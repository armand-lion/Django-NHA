{% load static %}
<!DOCTYPE html>
<html lang="nl">
    <head>
        <meta charset="utf-8">
        <title></title>
        <!-- Bootstrap CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3"
            crossorigin="anonymous">
        <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    </head>
    <body>
        <div class="header">
            <h1>Mijn website<h1>
        </div>
        <div class="main pt-4 pb-4">
            <div class="postblock">
                {% block content %}
                    {% for post in posts %}
                        <article class="post">
                            <time class="date d-block mb-2">
                                {{ post.published_date|date:"j F Y H:i" }}
                            </time>
                            <h2>
                                <a href="">
                                    {{ post.title }}
                                </a>
                            </h2>
                            <p>
                                {{ post.text|linebreaksbr }}
                            </p>
                        </article>
                    {% endfor %}
                {% endblock %}
        </div></div>
        <div class="footer">&nbsp;</div>
    </body>
</html>
